name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches: [ "main", "v4" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Clean Environment
        run: rm -f OfflineChat/local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: OfflineChat

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace
        working-directory: OfflineChat

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisp-app-debug
          path: OfflineChat/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Whisp ${{ github.ref_name }}
          body: |
            ## 🛰️ Whisp ${{ github.ref_name }} — Distributed Offline Mesh & Admin Control Plane

            ### 🚀 Highlights & Features in v4.2.0:
            - **⛓️ Unique Blockchain IDs (`0x...`)**: Deterministic decentralized identity addresses for every user to enable offline delay-tolerant routing over physical mesh hops.
            - **👥 Search & Add Friends (1-on-1 Direct Chats)**: Search users by username or Blockchain ID and chat privately in isolated encrypted 1-on-1 rooms instead of global broadcast.
            - **🚨 Dedicated Emergency Authorities SOS Channel**: Priority 100 emergency broadcast channel guaranteed to bypass battery throttling and route to local response authorities.
            - **✨ UI / UX Overhaul**: Modern channel switcher (Direct Chats, General Mesh, Radio Peers), contact cards, and real-time route tracing.
            - **👥 Dynamic User Registration & Login**: Users can create new accounts directly from the app or web control plane and log in dynamically.
            - **🔒 Protected Admin Gate**: The Admin Control Screen is secured with master authentication (`whispadmin123` / `operator123` / dynamic admin credentials).
            - **🌐 Web Admin Control Plane**: Live health score, 2D topology radar, and DTN custody tracking.
            - **🛡️ Zero-Trust Security & Envelope Signatures**: Ed25519 cryptographic signatures and token-bucket DoS defense.
            - **📬 Delay-Tolerant Networking (DTN)**: 500 MB bounded storage with multi-factor custody eviction.
            - **📝 Offline CRDT Collaboration**: Collaborative checklists with deterministic Last-Write-Wins merging.

            ### 📲 Installation:
            Download `app-debug.apk` attached below and install on Android 14+ devices.
          files: |
            OfflineChat/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

